<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>授業交換候補表示（共通候補表示）</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body {
  font-family: "Segoe UI", Roboto, sans-serif;
  margin: 0;
  background: #f0f2f5;
  color: #333;
}
.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 1rem 2rem;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.1);
  display: flex;
  flex-direction: column;
  height: 90vh;
}
h1 {
  font-size: 1.3rem;
  text-align: center;
  margin-bottom: 0.8rem;
}
.form-wrapper {
  display: flex;
  gap: 1rem;
  margin-bottom: 0.5rem;
  align-items: flex-end;
}
select {
  width: 100%;
  padding: 0.4rem;
  font-size: 0.95rem;
  border-radius: 6px;
  border: 1px solid #ccc;
  background: #fafafa;
}
select:focus {
  border-color: #007bff;
  outline: none;
  box-shadow: 0 0 5px rgba(0,123,255,0.3);
}
.selected-teachers-wrapper {
  display: flex;
  align-items: center;
  margin-top: 0.5rem;
  gap: 0.5rem;
  font-size: 0.95rem;
  font-weight: 600;
}
.selected-teachers {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
}
.teacher-tag, .selected-lesson-tag {
  display: inline-block;
  border-radius: 6px;
  padding: 2px 6px;
}
.teacher-tag { background: #e0ebff; }
.selected-lesson-tag { background: #d1ffd1; margin:2px; }
button {
  padding: 2px 6px;
  font-size: 0.95rem;
  border-radius: 6px;
  border: 1px solid #ccc;
  background: #f0f0f0;
  cursor: pointer;
  height: 100%;
}
button:hover { background: #e0e0e0; }
#results {
  margin-top: 0.5rem;
  font-size: 0.95rem;
  overflow-y: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 0.5rem;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 3px 10px rgba(0,0,0,0.05);
}
th, td {
  padding: 0.6rem;
  text-align: left;
  font-size: 0.9rem;
}
thead {
  background: #007bff;
  color: #fff;
  position: sticky;
  top: 0;
}
tbody tr:nth-child(even) { background: #f7f7f7; }
tbody tr.parttime { background: #fff4e6; }
</style>
</head>
<body>
<div class="container">
<h1>授業交換候補表示</h1>

<div class="form-wrapper">
  <select id="teacherSelect" disabled><option value="">教員を選択</option></select>
  <select id="lessonSelect" disabled><option value="">授業を選択</option></select>
</div>

<div class="selected-teachers-wrapper">
  <div class="selected-teachers" id="selectedTeachers">選択中の教員: なし</div>
  <button id="resetTeachers" type="button">リセット</button>
</div>

<div class="selected-teachers-wrapper">
  <div class="selected-teachers" id="selectedLessonsDiv">選択中の授業: なし</div>
  <button id="resetLessons" type="button">リセット</button>
</div>

<div id="results">©飯村貴洋</div>
</div>

<script>
const lessonsUrl = "https://raw.githubusercontent.com/incict-design/jugyo/main/data/lessons.csv";
const trainingsUrl = "https://raw.githubusercontent.com/incict-design/jugyo/main/data/trainings.csv";

const DAY_MAP_IN = {"mon":"Mon","月":"Mon","tue":"Tue","火":"Tue","wed":"Wed","水":"Wed","thu":"Thu","木":"Thu","fri":"Fri","金":"Fri","sat":"Sat","土":"Sat"};
const DAY_JA_OUT = {Mon:"月",Tue:"火",Wed:"水",Thu:"木",Fri:"金",Sat:"土"};
const ORD = {1:"1限",2:"2限",3:"3限",4:"4限",5:"5限",6:"6限",7:"7限"};

let lessons=[], trainings=[], trainingTeachers=new Set(), teacherParttimeMap=new Map();
const teacherSelect = document.getElementById('teacherSelect');
const lessonSelect = document.getElementById('lessonSelect');
const resultsDiv = document.getElementById('results');
const selectedTeachersDiv = document.getElementById('selectedTeachers');
const selectedLessonsDiv = document.getElementById('selectedLessonsDiv');

let selectedTeachers = [];
let selectedLessons = [];

function parseCSV(text){ return text.replace(/^\uFEFF/,'').trim().split(/\r?\n/).map(l=>l.split(',').map(s=>s.trim())); }
function normalizeDay(d){ return DAY_MAP_IN[d.toLowerCase()]||d; }
function parseDigit(s){ const m=String(s).match(/\d+/); return m?parseInt(m[0],10):NaN; }
function parseGrade(g){ const n=parseDigit(g); return [1,2,3].includes(n)?n:NaN; }
function parseClass(c){ return parseDigit(c); }
function parsePeriod(p){ const n=parseDigit(p); return (n>=1&&n<=7)?n:NaN; }
function normalizeCourse(c){ if(!c)return""; const low=c.trim().toLowerCase(); if(["文系","humanities","h"].includes(low))return"文系"; if(["理系","science","s"].includes(low))return"理系"; return c.trim(); }
function periodToSlot(period){ return period<=4?"am":"pm"; }
function teacherHasSlot(teacher,day,period){ return lessons.some(l=>l.teacher===teacher && l.day===day && l.period===period); }
function formatSlot(day,period){ return (DAY_JA_OUT[day]||day)+(ORD[period]||period+"限"); }
function isParttimeTeacher(teacher){ if(!trainingTeachers.has(teacher)) return true; return !!teacherParttimeMap.get(teacher); }

async function loadCSVs() {
  const [lText, tText] = await Promise.all([fetch(lessonsUrl).then(r=>r.text()), fetch(trainingsUrl).then(r=>r.text())]);
  loadLessons(lText); loadTrainings(tText);
}

function loadLessons(text){
  const d=parseCSV(text);
  const h=d[0].map(x=>x.toLowerCase());
  const iT=h.indexOf('teacher'),iG=h.indexOf('grade'),iC=h.indexOf('class'),iCourse=h.indexOf('course'),iD=h.indexOf('day'),iP=h.indexOf('period'),iS=h.indexOf('subject');
  lessons=d.slice(1).map(r=>({teacher:r[iT],grade:parseGrade(r[iG]),class:parseClass(r[iC]),course:normalizeCourse(r[iCourse]),day:normalizeDay(r[iD]),period:parsePeriod(r[iP]),subject:r[iS]})).filter(l=>l.teacher);
  const teachers=[...new Set(lessons.map(l=>l.teacher))];
  teacherSelect.innerHTML='<option value="">教員を選択</option>';
  teachers.forEach((t,i)=>{ const op=document.createElement('option'); op.value=t; op.textContent=`${i+1}. ${t}`; teacherSelect.appendChild(op); });
  teacherSelect.disabled=false;
}

function loadTrainings(text){
  const d=parseCSV(text);
  const h=d[0].map(x=>x.toLowerCase());
  const iT=h.indexOf('teacher'), iD=h.indexOf('day'), iSlot=h.indexOf('slot'), iPart=h.indexOf('parttime');
  trainings=d.slice(1).map(r=>({teacher:r[iT], day:normalizeDay(r[iD]), slot:(r[iSlot]||"").toLowerCase(), parttime:(String(r[iPart]).toLowerCase()==="yes")}));
  trainingTeachers=new Set(trainings.map(t=>t.teacher));
  trainings.forEach(t=>teacherParttimeMap.set(t.teacher,t.parttime));
}

teacherSelect.addEventListener('change',()=>{
  const t=teacherSelect.value;
  if(!t) return;
  if(selectedTeachers.includes(t)) return alert("同じ教員は選べません。");
  if(selectedTeachers.length>=3) return alert("最大3人まで選択できます。");
  selectedTeachers.push(t);
  updateSelectedTeachersDisplay();
  teacherSelect.value="";

  const myLessons = lessons.filter(l=>selectedTeachers.includes(l.teacher));
  lessonSelect.innerHTML = '<option value="">授業を選択</option>';
  myLessons.forEach((l)=>{ const op=document.createElement('option'); op.value=lessons.indexOf(l); op.textContent=`${l.teacher}：${formatSlot(l.day,l.period)} ${l.grade}年${l.class}組 ${l.subject}`; lessonSelect.appendChild(op); });
  lessonSelect.disabled=false;
});

lessonSelect.addEventListener('change',()=>{
  const idx = Number(lessonSelect.value);
  if(Number.isNaN(idx)) return;
  if(selectedLessons.length >= 2) return alert("授業は2つまで選択できます。");
  const me = lessons[idx];
  selectedLessons.push(me);
  updateSelectedLessonsDisplay();
  lessonSelect.value="";
  updateResults();
});

function updateSelectedTeachersDisplay(){
  if(selectedTeachers.length===0){ selectedTeachersDiv.textContent="選択中の教員: なし"; }
  else { selectedTeachersDiv.innerHTML="選択中の教員: "+selectedTeachers.map(t=>`<span class='teacher-tag'>${t}</span>`).join(""); }
}

function updateSelectedLessonsDisplay(){
  if(selectedLessons.length===0){ selectedLessonsDiv.textContent="選択中の授業: なし"; }
  else { selectedLessonsDiv.innerHTML="選択中の授業: "+selectedLessons.map(l=>`<span class='selected-lesson-tag'>${l.teacher}：${l.subject}</span>`).join(""); }
}

function updateResults(){
  resultsDiv.innerHTML="";
  if(selectedLessons.length===0) return;

  // 全候補を日付_時限でマップ
  const candidatesMap = new Map();

  lessons.forEach(other=>{
    // 選択授業の教師は除外
    if(selectedLessons.some(s=>s.teacher===other.teacher)) return;

    // 選択授業と同じ学年・クラス
    if(!selectedLessons.every(s => s.grade===other.grade && s.class===other.class)) return;

    selectedLessons.forEach(s=>{
      if(teacherHasSlot(s.teacher, other.day, other.period)) return;
      if(teacherHasSlot(other.teacher, s.day, s.period)) return;

      const key = `${other.day}_${other.period}`;
      if(!candidatesMap.has(key)) candidatesMap.set(key, []);
      candidatesMap.get(key).push({
        teacher: other.teacher,
        detail: `${formatSlot(other.day,other.period)} ${other.grade}年${other.class}組 ${other.subject}`,
        parttime: isParttimeTeacher(other.teacher)
      });
    });
  });

  // 2つの授業で共通の候補のみ
  const finalCandidates = [];
  candidatesMap.forEach((arr,key)=>{
    if(arr.length === selectedLessons.length) finalCandidates.push(...arr);
  });

  if(finalCandidates.length===0){ resultsDiv.textContent="候補なし"; return; }

  const tbl=document.createElement('table');
  tbl.innerHTML="<thead><tr><th>曜日・限</th><th>教員</th><th>授業</th></tr></thead>";
  const tb=document.createElement('tbody');
  finalCandidates.forEach(c=>{
    const tr=document.createElement('tr');
    if(c.parttime) tr.className="parttime";
    tr.innerHTML=`<td>${c.detail.split(" ")[0]}</td><td>${c.teacher}</td><td>${c.detail.split(" ").slice(1).join(" ")}</td>`;
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);
  resultsDiv.appendChild(tbl);
}

// リセット
document.getElementById("resetTeachers").addEventListener("click",()=>{
  selectedTeachers=[]; selectedLessons=[]; updateSelectedTeachersDisplay(); updateSelectedLessonsDisplay();
  lessonSelect.innerHTML='<option value="">授業を選択</option>'; lessonSelect.disabled=true; resultsDiv.innerHTML="©飯村貴洋";
});
document.getElementById("resetLessons").addEventListener("click",()=>{
  selectedLessons=[]; updateSelectedLessonsDisplay(); resultsDiv.innerHTML="©飯村貴洋";
});

window.addEventListener("DOMContentLoaded", loadCSVs);
</script>
</body>
</html>
