<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>授業交換候補表示</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body {
      font-family: "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #f0f2f5;
      color: #333;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 1rem 2rem; /* 上下のパディングを少し小さく */
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      height: 90vh; /* 画面いっぱいに近い高さ */
    }
    h1 {
      font-size: 1.3rem; /* 少し小さく */
      text-align: center;
      margin-bottom: 0.8rem; /* 縦幅を縮める */
      flex-shrink: 0;
    }

    .form-wrapper {
      flex-shrink: 0;
      margin-bottom: 0.5rem; /* 下との間隔を小さく */
    }

    label {
      display: block;
      margin-top: 0.5rem; /* 縦の間隔を小さく */
      font-weight: 500;
      font-size: 0.95rem;
    }
    select {
      width: 100%;
      padding: 0.4rem; /* 高さを少し小さく */
      margin-top: 0.2rem; /* 縦の間隔を小さく */
      font-size: 0.95rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #fafafa;
      transition: 0.2s;
    }
    select:focus {
      border-color: #007bff;
      outline: none;
      box-shadow: 0 0 5px rgba(0,123,255,0.3);
    }

    #results {
      margin-top: 0.5rem;
      font-size: 0.95rem;
      overflow-y: auto;
      flex-grow: 1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    }
    th, td {
      padding: 0.6rem; /* 少し小さく */
      text-align: left;
      font-size: 0.9rem;
    }
    thead {
      background: #007bff;
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    tbody tr:nth-child(even) {
      background: #f7f7f7;
    }
    tbody tr.training-conflict {
      color: red;
      font-weight: 600;
    }
    tbody tr.parttime-row {
      color: #007bff;
      font-weight: 600;
    }

    .table-wrapper {
      overflow-x: auto;
      margin-top: 0.5rem;
    }

    .warn {
      color: #b35;
      font-weight: 600;
    }

    .muted {
      color: #777;
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>授業交換候補表示</h1>

    <div class="form-wrapper">
      <label>教員:
        <select id="teacherSelect" disabled>
          <option value="">読み込み中...</option>
        </select>
      </label>

      <label>授業:
        <select id="lessonSelect" disabled>
          <option value="">読み込み中...</option>
        </select>
      </label>
    </div>

    <div id="results" class="muted">©飯村貴洋</div>
  </div>

  <script>
    // 以下のJSは元のコードをそのまま使用
    const lessonsUrl = "https://raw.githubusercontent.com/incict-design/jugyo/main/data/lessons.csv";
    const trainingsUrl = "https://raw.githubusercontent.com/incict-design/jugyo/main/data/trainings.csv";

    const CLASS_LIMITS = {1:9,2:8,3:9};
    const DAY_MAP_IN = {"mon":"Mon","monday":"Mon","月":"Mon","tue":"Tue","tuesday":"Tue","火":"Tue","wed":"Wed","wednesday":"Wed","水":"Wed","thu":"Thu","thursday":"Thu","木":"Thu","fri":"Fri","friday":"Fri","金":"Fri","sat":"Sat","saturday":"Sat","土":"Sat"};
    const DAY_JA_OUT = {Mon:"月",Tue:"火",Wed:"水",Thu:"木",Fri:"金",Sat:"土"};
    const ORD = {1:"1限",2:"2限",3:"3限",4:"4限",5:"5限",6:"6限",7:"7限"};

    let lessons=[],trainings=[],trainingTeachers=new Set(),teacherParttimeMap=new Map();
    const teacherSelect=document.getElementById('teacherSelect');
    const lessonSelect=document.getElementById('lessonSelect');
    const resultsDiv=document.getElementById('results');

    function parseCSV(text){ return text.replace(/^\uFEFF/,'').trim().split(/\r?\n/).map(l=>l.split(',').map(s=>s.trim())); }
    function normalizeDay(d){ if(!d) return ""; const k=String(d).toLowerCase(); return DAY_MAP_IN[k]||d; }
    function parseDigit(s){ if(s==null) return NaN; const m=String(s).match(/\d+/); return m?parseInt(m[0],10):NaN; }
    function parseGrade(g){ const n=parseDigit(g); return [1,2,3].includes(n)?n:NaN; }
    function parseClass(c){ return parseDigit(c); }
    function parsePeriod(p){ const n=parseDigit(p); return (n>=1&&n<=7)?n:NaN; }
    function normalizeCourse(c){ if(!c) return ""; const low=String(c).trim().toLowerCase(); if(["文系","humanities","arts","h"].includes(low))return"文系"; if(["理系","science","sci","s"].includes(low))return"理系"; return String(c).trim(); }
    function periodToSlot(period){ return period<=4?"am":"pm"; }
    function teacherHasSlot(teacher,day,period){ return lessons.some(l=>l.teacher===teacher&&l.day===day&&l.period===period); }
    function sameClassAndCourse(a,b){ if(a.grade!==b.grade) return false; if(a.class!==b.class) return false; if(a.grade>=2&&(a.course||"")!==(b.course||"")) return false; return true; }
    function formatSlot(day,period){ const d=DAY_JA_OUT[day]||day; const p=ORD[period]||(period+"限"); return d+p; }
    function findTraining(teacher,day,slot){ return trainings.find(t=>t.teacher===teacher&&t.day===day&&t.slot===slot); }
    function isParttimeTeacher(teacher){ if(!trainingTeachers.has(teacher)) return true; return !!teacherParttimeMap.get(teacher); }
    function rankCandidate(c){ const isJoint=!!c.other.group; if(!c.trainingOverlap&&!c.parttime&&!isJoint)return 3; if(isJoint&&!c.trainingOverlap&&!c.parttime)return 2; if(c.trainingOverlap&&!c.parttime)return 1; return 0; }

    async function loadCSVs() {
      try {
        const [lessonsText, trainingsText] = await Promise.all([
          fetch(lessonsUrl).then(r => r.text()),
          fetch(trainingsUrl).then(r => r.text())
        ]);
        loadLessonsFromText(lessonsText);
        loadTrainingsFromText(trainingsText);
      } catch(e) {
        resultsDiv.innerHTML = `<span class="warn">CSVの読み込みに失敗しました。</span>`;
      }
    }

    function loadLessonsFromText(text){
      const data=parseCSV(text);
      const h=data[0].map(x=>x.toLowerCase());
      const iT=h.indexOf('teacher'), iG=h.indexOf('grade'), iC=h.indexOf('class'),
            iCourse=h.indexOf('course'), iD=h.indexOf('day'), iP=h.indexOf('period'),
            iS=h.indexOf('subject'), iGrp=h.indexOf('group');
      lessons = data.slice(1).map(r=>({
        teacher:r[iT], grade:parseGrade(r[iG]), class:parseClass(r[iC]),
        course:normalizeCourse(r[iCourse]), day:normalizeDay(r[iD]), period:parsePeriod(r[iP]),
        subject:r[iS], group:(iGrp>=0?(r[iGrp]||""):"")
      })).filter(l=>l.teacher&&[1,2,3].includes(l.grade)&&["Mon","Tue","Wed","Thu","Fri","Sat"].includes(l.day));
      enableTeacherSelect([...new Set(lessons.map(l=>l.teacher))]);
    }

    function loadTrainingsFromText(text){
      const data=parseCSV(text);
      const h=data[0].map(x=>x.toLowerCase());
      const iT=h.indexOf('teacher'), iD=h.indexOf('day'), iSlot=h.indexOf('slot'),
            iDetail=h.indexOf('detail'), iPart=h.indexOf('parttime');
      trainings = data.slice(1).map(r=>({
        teacher:r[iT], day:normalizeDay(r[iD]), slot:(r[iSlot]||"").toLowerCase(),
        detail:iDetail>=0?r[iDetail]:"", parttime:iPart>=0?(String(r[iPart]).toLowerCase()==="yes"):false
      }));
      trainingTeachers = new Set(trainings.map(t=>t.teacher));
      trainings.forEach(t=>{ teacherParttimeMap.set(t.teacher,(teacherParttimeMap.get(t.teacher)||false)||t.parttime); });
    }

    function enableTeacherSelect(list){
      teacherSelect.innerHTML = '<option value="">教員を選択</option>';
      list.forEach((t,index)=>{
        const op = document.createElement('option');
        op.value = t;
        op.textContent = `${index+1}. ${t}`;
        teacherSelect.appendChild(op);
      });
      teacherSelect.disabled = false;
      lessonSelect.disabled = true;
    }

    teacherSelect.addEventListener('change',e=>{
      const name = e.target.value;
      const myLessons = lessons.filter(l=>l.teacher === name);
      lessonSelect.innerHTML = '<option value="">授業を選択</option>';
      myLessons.forEach(l=>{
        const op = document.createElement('option');
        op.value = lessons.indexOf(l);
        op.textContent = `${formatSlot(l.day,l.period)} ${l.grade}年${l.class}組 ${l.subject}`;
        lessonSelect.appendChild(op);
      });
      lessonSelect.disabled = false;
    });

    lessonSelect.addEventListener('change',e=>{
      const idx = Number(e.target.value);
      if(Number.isNaN(idx)) return;
      const me = lessons[idx];
      const myDay = me.day, myPeriod = me.period, mySlot = periodToSlot(myPeriod);
      let candidates = [];
      lessons.forEach(other=>{
        if(other.teacher===me.teacher) return;
        if(!sameClassAndCourse(me,other)) return;
        if(teacherHasSlot(me.teacher,other.day,other.period)) return;
        if(teacherHasSlot(other.teacher,myDay,myPeriod)) return;
        const trainingInfo = findTraining(other.teacher,myDay,mySlot);
        const trainingOverlap = !!trainingInfo;
        const parttimeFlag = isParttimeTeacher(other.teacher);
        candidates.push({ other, trainingOverlap, parttime: parttimeFlag });
      });
      if(!candidates.length){ resultsDiv.innerHTML="<p>交換候補はありません。</p>"; return; }
      candidates.sort((a,b)=>rankCandidate(b)-rankCandidate(a));

      const wrapper = document.createElement('div');
      wrapper.className = 'table-wrapper';
      const tbl=document.createElement('table');
      tbl.innerHTML="<thead><tr><th>相手教員</th><th>相手授業</th><th>研修</th><th>非常勤</th></tr></thead>";
      const tb=document.createElement('tbody');
      candidates.forEach(c=>{
        const tr=document.createElement('tr');
        tr.innerHTML=`<td>${c.other.teacher}</td><td>${formatSlot(c.other.day,c.other.period)} ${c.other.grade}年${c.other.class}組 ${c.other.subject}</td><td style='text-align:center;'>${c.trainingOverlap?'〇':''}</td><td style='text-align:center;'>${c.parttime?'〇':''}</td>`;
        if(c.trainingOverlap) tr.classList.add("training-conflict");
        else if(c.parttime) tr.classList.add("parttime-row");
        tb.appendChild(tr);
      });
      tbl.appendChild(tb);
      wrapper.appendChild(tbl);
      resultsDiv.innerHTML="";
      resultsDiv.appendChild(wrapper);
    });

    window.addEventListener("DOMContentLoaded", loadCSVs);
  </script>
</body>
</html>
